version: "3.8"

services:
  backend:
    image: localhost/backend:latest
    container_name: my-app-backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    restart: always

  frontend:
    image: localhost/frontend:latest
    container_name: my-app-frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
